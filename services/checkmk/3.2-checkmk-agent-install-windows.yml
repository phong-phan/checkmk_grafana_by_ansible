---
- name: Installing CheckMK Agent on Windows hosts
  hosts: all
  vars_files:
    - /home/ansible/variables/vars_file.yml
    - ../../sites/{{ customer_name }}/CM/{{ site }}/playbooks/CMK/site_vars.yml
  tasks:
    - name: Validating required vault variables
      ansible.builtin.include_tasks: ../../commons/validate-vault-keys.yml
      vars:
        required_vars:
          - registration_user_secret
    - name: Finding matching entry from cmk_monitored_hosts var using IP
      ansible.builtin.set_fact:
        matched_monitored_host: "{{ (cmk_monitored_hosts | dict2items | selectattr('value.ip', 'equalto', ansible_host) | list) }}"
    - name: Failing if host IP is not present in cmk_monitored_hosts
      ansible.builtin.fail:
        msg: >-
          No entry in cmk_monitored_hosts matches this host's IP ({{ ansible_host }}).
          Add it to site_vars.yml before running this playbook against it.
      when: matched_monitored_host | length == 0
    - name: Checking if host is Windows based on folder name
      ansible.builtin.set_fact:
        is_windows_host: "{{ matched_monitored_host[0].value.folder in cmk_agent_windows_host_folders }}"
        fqdn_hostname: "{{ matched_monitored_host[0].key }}"
    - name: Installing CheckMK Agent on Windows hosts
      block:
        - name: Downloading CheckMK agent for Windows
          ansible.windows.win_get_url:
            url: "{{ cmk_msi_agent_package_url }}"
            dest: "C:\\Windows\\Temp\\{{ cmk_msi_agent_package_url | basename }}"
        - name: Installing CheckMK Agent on Windows
          ansible.windows.win_package:
            path: "C:\\Windows\\Temp\\{{ cmk_msi_agent_package_url | basename }}"
            state: present
            arguments: "/quiet /norestart"
        - name: Registering CheckMK Agent with CheckMK Server
          ansible.windows.win_shell: |
            cd "C:\Program Files (x86)\checkmk\service"
            .\cmk-agent-ctl.exe register --hostname {{ fqdn_hostname }} --server {{ cmk_server }} --site {{ cmk_site }} --user registration --password "{{ registration_user_secret }}" --trust-cert
          register: register_output
          changed_when: register_output.rc == 0
        - name: Opening Windows Firewall for CheckMK Agent
          community.windows.win_firewall_rule:
            name: "Allow CheckMK Agent"
            enable: true
            direction: in
            action: allow
            protocol: TCP
            localport: "{{ cmk_agent_firewall_port }}"
      when: is_windows_host
